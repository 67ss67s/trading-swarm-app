<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading Swarm · 楼层 B</title>
<style>
  :root{--bg:#120d0a;--panel:#1b1410;--panel-2:#241a14;--line:#3b2b1f;--ink:#f3e9d8;--dim:#a8987f;--faint:#6b5d4a;--accent:#ffb454;--good:#9be15d;--bad:#ff6b6b;--warn:#ffd166}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .app{display:grid;grid-template-rows:60px 1fr;height:100vh}
  /* 顶栏 */
  .top{display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);border-bottom:2px solid var(--line);min-width:0}
  .brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .logo{width:26px;height:26px;image-rendering:pixelated}
  .brand b{font-family:ui-monospace,monospace;font-size:16px;letter-spacing:.04em}
  .brand small{display:block;font-size:11px;color:var(--dim);letter-spacing:.02em}
  .kpis{display:flex;gap:18px}
  .kpi{display:flex;flex-direction:column;line-height:1.15}
  .kpi .k{font-size:11px;color:var(--dim)}
  .kpi .v{font-family:ui-monospace,monospace;font-size:17px;font-weight:700}
  .up{color:var(--good)} .down{color:var(--bad)}
  .spacer{flex:1}
  .heat{display:flex;align-items:center;gap:8px;cursor:pointer}
  .heat .lab{font-size:11px;color:var(--dim);line-height:1.2;text-align:right}
  .heat canvas{image-rendering:pixelated;display:block}
  .seg{display:flex;border:2px solid var(--line)}
  .seg button{font:inherit;font-size:12px;padding:5px 10px;background:transparent;color:var(--dim);border:0;cursor:pointer}
  .seg button.on{background:var(--accent);color:#120d0a;font-weight:700}
  /* 舞台 */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 316px;min-height:0}
  .scene{position:relative;min-width:0;min-height:0;overflow:hidden;background:#000}
  .scene > canvas{position:absolute;inset:0;display:block}
  .rail{background:var(--panel);border-left:2px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .blk{padding:12px 14px;border-bottom:2px solid var(--line)}
  .blk h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:8px;letter-spacing:.04em}
  .blk h3 .n{margin-left:auto;font-family:ui-monospace,monospace;color:var(--ink)}
  .inbox{background:linear-gradient(0deg,transparent,color-mix(in srgb,var(--warn) 10%,transparent))}
  .inbox h3{color:var(--warn)}
  .inbox .dot{width:8px;height:8px;background:var(--warn);display:inline-block;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  .item{padding:7px 9px;background:var(--panel-2);border:1px solid var(--line);margin-top:6px;font-size:13px;cursor:pointer}
  .item:hover{border-color:var(--warn)}
  .item small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .money .cell{background:var(--panel-2);border:1px solid var(--line);padding:7px 8px}
  .money .v{font-family:ui-monospace,monospace;font-size:15px;font-weight:700}
  .money .k{font-size:11px;color:var(--dim)}
  .feedblk{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:0}
  .feed{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
  .feed li{padding:7px 2px;border-top:1px dashed var(--line);font-size:13px;line-height:1.45}
  .feed li.new{animation:slide .35s steps(5)}
  .feed li:first-child{border-top:0}
  @keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  .feed .cs{font-family:ui-monospace,monospace;font-weight:700;font-size:12px}
  .feed .meta{display:flex;gap:8px;font-size:11px;color:var(--faint);margin-top:1px}
  .feed .tag{padding:0 5px;border:1px solid var(--line);color:var(--dim)}
  .feed .tag.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
  .feed .tag.evo{color:#ffe36b;border-color:#6a5a1a}

  /* 顶栏行情(可拖) */
  .coins{display:flex;gap:6px}
  .coin{display:flex;flex-direction:column;align-items:flex-start;padding:3px 8px;border:2px solid var(--line);background:var(--panel-2);cursor:grab;user-select:none;touch-action:none;line-height:1.2;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
  .coin:hover{border-color:var(--accent);transform:translateY(-1px)}
  .coin b{font-family:ui-monospace,monospace;font-size:12px}
  .coin span{font-family:ui-monospace,monospace;font-size:11px}
  .ghost{position:fixed;left:0;top:0;z-index:50;display:none;pointer-events:none;padding:6px 10px;background:#1a1520;color:#fff;border:2px solid #fff;box-shadow:4px 4px 0 rgba(0,0,0,.5);font-size:12px;image-rendering:pixelated}
  .ghost b{font-family:ui-monospace,monospace;font-size:14px;display:block}
  .ghost small{color:#bbb}
  .ghost.ok{border-color:#7dffb0;background:#10261a}
  .ghost.no{border-color:#ff5d7a}
  /* 当前策略卡(可拖) */
  .strat{margin-top:8px;display:flex;gap:8px;align-items:center;padding:7px 9px;border:2px dashed var(--line);background:var(--panel-2);cursor:grab;user-select:none;touch-action:none}
  .strat:hover{border-color:var(--accent)}
  .strat .grip{color:var(--faint);font-size:16px}
  .strat b{font-size:13px;display:block}
  .strat small{font-size:11px;color:var(--dim)}
  /* 紧急停止 */
  .estop{position:relative;width:118px;height:44px;flex:none}
  .estop .lid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.08em;color:#ffd5dc;cursor:pointer;z-index:2;
    background:repeating-linear-gradient(45deg,#3a0d14 0 6px,#240810 6px 12px);border:2px solid #ff3b5c;box-shadow:3px 3px 0 rgba(0,0,0,.5);transform-origin:top;transition:transform .25s steps(4)}
  .estop.open .lid{transform:perspective(200px) rotateX(78deg) translateY(-6px)}
  .estop .btn{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 40% 35%,#ff6b7d,#c8102e 60%,#6a0816);box-shadow:0 3px 0 #3a0008;color:#fff}
  .estop .btn span{position:relative;font-family:ui-monospace,monospace;font-size:10px;font-weight:800;letter-spacing:.04em}
  .estop .btn.hold{transform:translateY(2px);box-shadow:0 1px 0 #3a0008}
  .estop svg{position:absolute;inset:-5px;width:54px;height:54px;transform:rotate(-90deg)}
  .estop .trk{fill:none;stroke:rgba(255,255,255,.12);stroke-width:3}
  .estop .prog{fill:none;stroke:#ffe36b;stroke-width:3;stroke-linecap:butt}
  /* 场景里的像素卡片 / toast / 命令行 / 快捷键提示 */
  .pcard{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:20;width:340px;background:#0f0d14;color:#f4f1ea;border:3px solid #ffd23a;box-shadow:0 0 0 3px #000,6px 6px 0 3px rgba(0,0,0,.45);padding:14px 16px;font-size:13px}
  .pcard.run{border-color:#4fd1c5}
  .pcard h4{margin:0 0 8px;font-size:15px}
  .pcard p{margin:6px 0;line-height:1.5}
  .pcard .hint{color:#8a8398;font-size:11px}
  .pcard label{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
  .pcard select{font:inherit;background:#1a1722;color:#eee;border:2px solid #3a3446;padding:3px 6px}
  .pcard .env{font-size:28px;color:#ffd23a;float:right;line-height:1}
  .pcard .btns{display:flex;gap:8px;margin-top:10px}
  .pcard button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px 14px;border:2px solid #3a3446;background:#1a1722;color:#eee;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
  .pcard button.ok{background:#7dffb0;border-color:#7dffb0;color:#0b1a10}
  .pcard button.no{background:#ff5d7a;border-color:#ff5d7a;color:#1a0508}
  .toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);z-index:30;padding:8px 14px;background:#0f0d14;color:#f4f1ea;border:2px solid var(--accent);box-shadow:3px 3px 0 rgba(0,0,0,.5);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80%}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .console{position:absolute;left:16px;bottom:16px;z-index:25;width:min(560px,calc(100% - 32px));background:rgba(8,8,12,.94);border:2px solid #7dffb0;box-shadow:4px 4px 0 rgba(0,0,0,.5);font-family:ui-monospace,monospace;font-size:13px;color:#cfe;padding:8px 10px}
  .console .log div{padding:1px 0;white-space:pre-wrap}
  .console .log .dim{color:#7a8a84}.console .log .ok{color:#7dffb0}.console .log .err{color:#ff7a8a}
  .console .in{display:flex;gap:6px;align-items:center;border-top:1px dashed #2a3a34;margin-top:4px;padding-top:4px}
  .console .in span{color:#7dffb0}
  .console input{flex:1;font:inherit;background:transparent;border:0;outline:0;color:#fff}
  .keys{position:absolute;left:12px;top:10px;z-index:5;font-size:11px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.35);padding:3px 8px;pointer-events:none}
  .keys b{color:#fff}
  @media (prefers-reduced-motion: reduce){.feed li{animation:none}.inbox .dot{animation:none}.estop .lid,.toast{transition:none}}
  @media (max-width:1560px){.coin:nth-child(4){display:none}}
  @media (max-width:1360px){.kpis{gap:12px}.brand small{display:none}.stage{grid-template-columns:minmax(0,1fr) 288px}.coins{display:none}.heat .lab{display:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script type="module" src="./b/main.ts"></script>
</body>
</html>
