<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>紧急停止确认</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#090d11;color:#dfe6ea;font-family:Geist,-apple-system,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;font-size:12.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:#6fcadf;text-decoration:none}a:hover{color:#9adcea}
*{box-sizing:border-box}
.num{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.app{display:flex;overflow:hidden;background:#090d11;color:#dfe6ea}
.side{width:168px;flex:none;background:#05080b;border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;user-select:none}
.brand{display:flex;align-items:center;gap:8px;padding:10px 10px 6px}
.logo{width:26px;height:26px;border-radius:5px;background:#6fcadf;color:#041119;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.nav-g{padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.nav-l{height:24px;display:flex;align-items:center;padding:0 8px;font-size:10px;color:#868f95;letter-spacing:0.06em}
.nav-i{height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:6px;font-size:12.5px;color:#c5ccd0}
.nav-i.on{background:#161c23;color:#eef3f6}
.nav-i.dim{color:#5b656d}
.nav-i svg{flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,0.09);user-select:none}
.vsep{width:1px;height:16px;background:rgba(255,255,255,0.13);flex:none}
.status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid rgba(255,255,255,0.09);background:#05080b;font-size:11px;color:#868f95;user-select:none}
.content{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}
.ws{border:1px solid rgba(255,255,255,0.09);border-radius:6px;background:#10151a;overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-h{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,0.09);background:rgba(25,31,36,0.4);user-select:none}
.pane-t{font-size:12px;font-weight:600;letter-spacing:0.02em;white-space:nowrap;flex:none}
.pane-h .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pane-h > .row{flex:none}
.pane-b{flex:1;min-height:0;overflow:hidden}
.hint{font-size:11px;color:#868f95}
.tbl{width:100%;border-collapse:collapse}
.tbl th{height:30px;font-size:11px;font-weight:500;color:#868f95;text-align:left;padding:0 10px;border-bottom:1px solid rgba(255,255,255,0.09);white-space:nowrap}
.tbl td{padding:5px 10px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,0.06);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:500;border:1px solid transparent;white-space:nowrap;line-height:1}
.pill .dot{width:6px;height:6px;border-radius:999px;background:currentColor;flex:none}
.pill.ok{color:#48a870;background:rgba(72,168,112,0.12);border-color:rgba(72,168,112,0.28)}
.pill.warn{color:#bd903b;background:rgba(189,144,59,0.12);border-color:rgba(189,144,59,0.3)}
.pill.bad{color:#cc544b;background:rgba(204,84,75,0.12);border-color:rgba(204,84,75,0.3)}
.pill.live{color:#fff;background:#e24947;border-color:#e24947;font-weight:600}
.pill.ice{color:#6fcadf;background:rgba(111,202,223,0.1);border-color:rgba(111,202,223,0.3)}
.pill.mute{color:#c5ccd0;background:#1d2329;border-color:rgba(255,255,255,0.13)}
.pill.dim{color:#868f95;background:transparent;border-color:rgba(255,255,255,0.13)}
.pill.slate{color:#c9d3dc;background:rgba(120,139,161,0.16);border-color:rgba(120,139,161,0.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap;user-select:none}
.btn.pri{background:#6fcadf;color:#041119}
.btn.out{border-color:rgba(255,255,255,0.13);color:#dfe6ea;background:transparent}
.btn.ghost{color:#868f95;background:transparent}
.btn.danger{background:#da534f;color:#fff}
.btn.dout{border-color:rgba(218,83,79,0.45);color:#da534f;background:transparent}
.btn.xs{height:24px;padding:0 8px;font-size:11.5px}
.btn.lg{height:36px;padding:0 16px;font-size:13px}
.btn.dis{opacity:0.45}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:11px;color:#868f95}
.inp{height:30px;border:1px solid rgba(255,255,255,0.13);border-radius:6px;background:rgba(255,255,255,0.03);padding:0 9px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dfe6ea;min-width:0}
.inp.ro{background:transparent;color:#868f95}
.seg{display:inline-flex;flex:none;border:1px solid rgba(255,255,255,0.13);border-radius:6px;padding:2px;gap:2px;user-select:none}
.seg span{padding:2px 8px;border-radius:4px;font-size:11.5px;color:#868f95;white-space:nowrap}
.seg .on{background:#1d2329;color:#d9dfe3}
.seg .on.buy{background:rgba(72,168,112,0.18);color:#48a870}
.seg .on.sell{background:rgba(204,84,75,0.18);color:#cc544b}
.seg .on.livep{background:#e24947;color:#fff}
.seg .on.warnp{background:rgba(189,144,59,0.18);color:#bd903b}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;align-items:baseline}
.kv .k{color:#868f95;white-space:nowrap}
.card{border:1px solid rgba(255,255,255,0.09);border-radius:6px;background:#10151a}
.cell{display:flex;flex-direction:column;gap:2px;padding:10px 14px;min-width:0;overflow:hidden}
.cell .l{font-size:11px;color:#868f95;white-space:nowrap}
.cell .v{font-size:19px;font-weight:600;line-height:24px;white-space:nowrap}
.cell .v small{font-size:11px;font-weight:400;color:#868f95;margin-left:4px}
.cell .s{font-size:11px;color:#868f95;white-space:nowrap;display:flex;gap:8px;align-items:center;overflow:hidden;text-overflow:ellipsis}
.up{color:#48a870}.down{color:#cc544b}.warn{color:#bd903b}.live{color:#e24947}.ice{color:#6fcadf}.mutedc{color:#868f95}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.06);min-width:0}
.li:last-child{border-bottom:0}
.li.sel{background:rgba(111,202,223,0.07);box-shadow:inset 2px 0 0 #6fcadf}
.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.steps{display:flex;align-items:center;gap:0}
.step{display:flex;align-items:center;gap:5px;font-size:10px;white-space:nowrap}
.step .n{width:14px;height:14px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:9px;flex:none;border:1px solid rgba(255,255,255,0.13);color:#868f95}
.step.done .n{background:rgba(72,168,112,0.15);border-color:rgba(72,168,112,0.4);color:#48a870}
.step.on .n{background:#6fcadf;border-color:#6fcadf;color:#041119}
.step.bad .n{background:#e24947;border-color:#e24947;color:#fff}
.step.done{color:#c5ccd0}.step.on{color:#dfe6ea}.step.bad{color:#e24947}.step.todo{color:#868f95}
.sline{width:10px;height:1px;background:rgba(255,255,255,0.13);flex:none;margin:0 3px}
.chk{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;flex:none}
.chk.ok{background:rgba(72,168,112,0.16);color:#48a870}
.chk.bad{background:rgba(204,84,75,0.16);color:#cc544b}
.chk.warn{background:rgba(189,144,59,0.16);color:#bd903b}
.chk.todo{border:1px solid rgba(255,255,255,0.13);color:#868f95}
.chk.on{background:rgba(111,202,223,0.16);color:#6fcadf}
.note{font-size:11px;color:#868f95;line-height:1.5}
.banner{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;border:1px solid;font-size:12px}
.banner.live{border-color:rgba(226,73,71,0.45);background:rgba(226,73,71,0.09);color:#f1b3b2}
.banner.warn{border-color:rgba(189,144,59,0.4);background:rgba(189,144,59,0.09);color:#e3c98a}
.banner.ice{border-color:rgba(111,202,223,0.35);background:rgba(111,202,223,0.07);color:#bfe7f0}
.tab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;font-size:12px;color:#868f95;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#dfe6ea;border-bottom-color:#6fcadf}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:999px;font-size:10px;background:#1d2329;color:#c5ccd0}
.cnt.warn{background:rgba(189,144,59,0.2);color:#bd903b}
.ring{position:relative;display:inline-block;width:44px;height:44px;flex:none;vertical-align:middle}
.ring svg{display:block}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.spin{width:14px;height:14px;border-radius:999px;border:2px solid rgba(111,202,223,0.25);border-top-color:#6fcadf;flex:none}
.meter{height:4px;border-radius:2px;background:#1d2329;overflow:hidden;flex:1;min-width:40px}
.meter i{display:block;height:100%;border-radius:2px}
</style>
</helmet>
<div class="app" style="width:520px;height:520px">

<div style="width:520px;height:520px;background:#090d11;display:flex;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="width:480px;background:#13191f;border-color:rgba(226,73,71,0.5);box-shadow:0 20px 60px rgba(0,0,0,0.6);display:flex;flex-direction:column">
    <div class="col" style="padding:16px 18px 12px;gap:6px;border-bottom:1px solid rgba(255,255,255,0.09)">
      <div class="row" style="gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e24947" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"/><path d="M12 8v4M12 16h.01"/></svg><span style="font-size:15px;font-weight:700;color:#e24947">确认紧急停止</span><span style="margin-left:auto"><span class="pill dim mono ">operator.admin</span></span></div>
      <span class="note">立即生效,事件 policy.halted 会同时推 UI 与 Telegram。解除需 admin 且逐字回填 mode=run。</span>
    </div>
    <div class="col" style="padding:12px 18px;gap:8px">
      <div class="row" style="height:28px;border-bottom:1px solid rgba(255,255,255,0.06)"><span class="num hint" style="width:120px">mode</span><span class="num">run → halt_all</span></div><div class="row" style="height:28px;border-bottom:1px solid rgba(255,255,255,0.06)"><span class="num hint" style="width:120px">emergency_stop</span><span class="num">false → true</span></div><div class="row" style="height:28px;border-bottom:1px solid rgba(255,255,255,0.06)"><span class="num hint" style="width:120px">active 授权</span><span class="num">2 条 → revoked(emergency_stop)</span></div><div class="row" style="height:28px;border-bottom:1px solid rgba(255,255,255,0.06)"><span class="num hint" style="width:120px">新提议</span><span class="num">全部 gate 拒绝(含 cancel_order)</span></div><div class="row" style="height:28px;border-bottom:1px solid rgba(255,255,255,0.06)"><span class="num hint" style="width:120px">保留</span><span class="num">已确认的保护腿 · EmergencyReduce · 手动 reduce_only</span></div>
      <div class="field" style="margin-top:6px"><span class="lbl">输入 HALT 确认</span><div class="inp num" style="height:36px;font-size:14px">HAL<span style="width:1px;height:16px;background:#dfe6ea;margin-left:1px"></span></div></div>
    </div>
    <div class="row" style="padding:12px 18px;border-top:1px solid rgba(255,255,255,0.09);gap:8px;justify-content:flex-end"><span class="btn ghost lg ">取消</span><span class="btn danger lg dis"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"/><path d="M12 8v4M12 16h.01"/></svg>立即停止</span></div>
  </div>
</div>
</div>
</x-dc>
</body>
</html>
